[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fishin"
version = "0.2.0"
description = "Terminal solunar, tide, and weather forecast for the fishing / hunting day-planner crowd"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Steve Wasko" }]
keywords = ["solunar", "tide", "weather", "fishing", "terminal", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "skyfield>=1.45",
    "rich>=13",
    "diskcache>=5",
    "timezonefinder>=6",
]

[project.scripts]
fishin = "fishin.cli:cli_main"

[tool.hatch.build.targets.wheel]
packages = ["fishin"]

[tool.hatch.build.targets.sdist]
include = ["fishin", "README.md"]
